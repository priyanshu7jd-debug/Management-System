        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- Dashboard
  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Cross-module aggregated counts (Authority, Admin)
      description: Totals and breakdowns across disasters, shelters, volunteers, resources, tasks, donations, alerts and users.
      responses:
        "200": { description: Aggregated summary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/dashboard/trends:
    get:
      tags: [Dashboard]
      summary: Daily counts over the last N days, for charts (Authority, Admin)
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 14, minimum: 1, maximum: 90 }
      responses:
        "200": { description: Daily trend series }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------- Notifications
  /api/notifications:
    get:
      tags: [Notifications]
      summary: List the current user's notifications (direct + broadcast)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: type
          in: query
          schema: { type: string, enum: [Alert, Task, Donation, Disaster, Shelter, System] }
        - name: unread
          in: query
          description: "If \"true\", only notifications not yet read by the current user"
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get the current user's unread notification count
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      count: { type: integer, example: 3 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all of the current user's notifications as read
      responses:
        "200": { description: All notifications marked read }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete a notification (Authority, Admin)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/DeletedOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Send the token returned by /api/auth/login or /api/auth/register as "Authorization: Bearer <token>".'

  parameters:
    id:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId
      schema: { type: string, example: 65f1a2b3c4d5e6f7a8b9c0d1 }
    page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    lat:
      name: lat
      in: query
      required: true
      schema: { type: number, minimum: -90, maximum: 90, example: 26.1584 }
    lng:
      name: lng
      in: query
      required: true
      schema: { type: number, minimum: -180, maximum: 180, example: 91.6716 }
    maxDistance:
      name: maxDistance
      in: query
      description: Search radius in meters (capped at 200000)
      schema: { type: integer, default: 10000, minimum: 1 }

  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated, but the user's role may not perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: No record with that ID
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DeletedOk:
      description: Deleted successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              message: { type: string, example: Deleted successfully }
    UserList:
      description: Paginated list of users
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedEnvelope"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: A descriptive error message }

    PaginatedEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        count: { type: integer, example: 20 }
        total: { type: integer, example: 57 }
        page: { type: integer, example: 1 }
        pages: { type: integer, example: 3 }

    HazardType:
      type: string
      enum: [Flood, Cyclone, Earthquake, Landslide, Fire, Accident, Other]

    Severity:
      type: string
      enum: [Low, Medium, High, Critical]

    DisasterStatus:
      type: string
      enum: [Pending, Verified, In Progress, Resolved, Rejected]

    ResourceCategory:
      type: string
      enum: [Food, Water, Medical, Clothing, Bedding, Equipment, Other]

    TaskCategory:
      type: string
      enum: [Rescue, Relief Distribution, Medical, Logistics, Shelter Management, Other]

    Coordinates:
      type: object
      properties:
        lat: { type: number, example: 26.1584 }
        lng: { type: number, example: 91.6716 }

    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string, example: Anup Kalita }
        email: { type: string, format: email }
        role: { type: string, enum: [Citizen, Authority, Volunteer, Admin] }
        district: { type: string }
        phone: { type: string }
        status: { type: string, enum: [Active, Blocked] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
            role: { type: string, enum: [Citizen, Authority, Volunteer, Admin] }
            district: { type: string }
            status: { type: string, enum: [Active, Blocked] }
            token: { type: string, description: JWT to send as a Bearer token }

    Disaster:
      type: object
      properties:
        _id: { type: string }
        disasterId: { type: string, example: DR-1001 }
        type: { $ref: "#/components/schemas/HazardType" }
        location: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        severity: { $ref: "#/components/schemas/Severity" }
        description: { type: string }
        reportedBy: { type: string, description: User ObjectId (populated on list/detail views) }
        reportedByName: { type: string }
        status: { $ref: "#/components/schemas/DisasterStatus" }
        team: { type: string, example: Guwahati Flood Response Team }
        verifiedBy: { type: string, description: User ObjectId }
        images: { type: array, items: { type: string, format: uri } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DisasterInput:
      type: object
      required: [type, location]
      properties:
        type: { $ref: "#/components/schemas/HazardType" }
        location: { type: string, example: "Pandu Ghat, Guwahati" }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        severity: { $ref: "#/components/schemas/Severity" }
        description: { type: string }
        images: { type: array, items: { type: string, format: uri } }

    Shelter:
      type: object
      properties:
        _id: { type: string }
        shelterId: { type: string, example: SH-501 }
        name: { type: string }
        location: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        capacity: { type: integer }
        currentOccupancy: { type: integer }
        resources:
          type: object
          properties:
            food: { type: boolean }
            water: { type: boolean }
            medical: { type: boolean }
            bedding: { type: boolean }
        contactPerson: { type: string }
        contactPhone: { type: string }
        images: { type: array, items: { type: string, format: uri } }
        status: { type: string, enum: [Active, Full, Closed] }
        managedBy: { type: string, description: User ObjectId }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ShelterInput:
      type: object
      required: [name, location, capacity]
      properties:
        name: { type: string }
        location: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        capacity: { type: integer, minimum: 0 }
        contactPerson: { type: string }
        contactPhone: { type: string }
        resources:
          type: object
          properties:
            food: { type: boolean }
            water: { type: boolean }
            medical: { type: boolean }
            bedding: { type: boolean }

    Resource:
      type: object
      properties:
        _id: { type: string }
        resourceId: { type: string, example: RS-701 }
        name: { type: string }
        category: { $ref: "#/components/schemas/ResourceCategory" }
        quantity: { type: integer }
        unit: { type: string }
        lowStockThreshold: { type: integer }
        status: { type: string, enum: [Available, Low, Depleted] }
        shelter: { type: string, nullable: true, description: Shelter ObjectId }
        disaster: { type: string, nullable: true, description: Disaster ObjectId }
        location: { type: string }
        addedBy: { type: string, description: User ObjectId }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ResourceInput:
      type: object
      required: [name, quantity]
      properties:
        name: { type: string }
        category: { $ref: "#/components/schemas/ResourceCategory" }
        quantity: { type: integer, minimum: 0 }
        unit: { type: string }
        lowStockThreshold: { type: integer, minimum: 0 }
        shelter: { type: string, description: Shelter ObjectId }
        disaster: { type: string, description: Disaster ObjectId }
        location: { type: string }
        notes: { type: string }

    Task:
      type: object
      properties:
        _id: { type: string }
        taskId: { type: string, example: TK-901 }
        title: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/TaskCategory" }
        priority: { $ref: "#/components/schemas/Severity" }
        status: { type: string, enum: [Pending, In Progress, Completed, Cancelled] }
        assignedTo: { type: string, nullable: true, description: User ObjectId }
        assignedBy: { type: string, description: User ObjectId }
        relatedDisaster: { type: string, nullable: true, description: Disaster ObjectId }
        relatedShelter: { type: string, nullable: true, description: Shelter ObjectId }
        dueDate: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/TaskCategory" }
        priority: { $ref: "#/components/schemas/Severity" }
        assignedTo: { type: string, description: User ObjectId }
        relatedDisaster: { type: string, description: Disaster ObjectId }
        relatedShelter: { type: string, description: Shelter ObjectId }
        dueDate: { type: string, format: date-time }
        notes: { type: string }

    Volunteer:
      type: object
      properties:
        _id: { type: string }
        volunteerId: { type: string, example: VL-201 }
        user: { type: string, description: User ObjectId (populated on list/detail views) }
        skills: { type: array, items: { type: string } }
        district: { type: string }
        availability: { type: string, enum: [Available, Unavailable] }
        status: { type: string, enum: [Pending, Approved, Rejected, Inactive] }
        assignedDisaster: { type: string, nullable: true, description: Disaster ObjectId }
        assignedShelter: { type: string, nullable: true, description: Shelter ObjectId }
        verifiedBy: { type: string, description: User ObjectId }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Donation:
      type: object
      properties:
        _id: { type: string }
        donationId: { type: string, example: DN-2001 }
        donorName: { type: string }
        donorEmail: { type: string, format: email }
        donorPhone: { type: string }
        type: { type: string, enum: [Cash, Kind] }
        amount: { type: number, description: Required and > 0 when type is Cash }
        paymentMethod: { type: string, enum: [UPI, Bank Transfer, Card, Cash, Other] }
        transactionId: { type: string }
        itemName: { type: string, description: Required when type is Kind }
        quantity: { type: number, description: Required and > 0 when type is Kind }
        unit: { type: string }
        relatedDisaster: { type: string, nullable: true, description: Disaster ObjectId }
        relatedShelter: { type: string, nullable: true, description: Shelter ObjectId }
        status: { type: string, enum: [Pending, Received, Utilized, Cancelled] }
        receivedBy: { type: string, nullable: true, description: User ObjectId }
        recordedBy: { type: string, description: User ObjectId }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DonationInput:
      type: object
      required: [donorName, type]
      properties:
        donorName: { type: string }
        donorEmail: { type: string, format: email }
        donorPhone: { type: string }
        type: { type: string, enum: [Cash, Kind] }
        amount: { type: number, description: Required when type is Cash }
        paymentMethod: { type: string, enum: [UPI, Bank Transfer, Card, Cash, Other] }
        transactionId: { type: string }
        itemName: { type: string, description: Required when type is Kind }
        quantity: { type: number, description: Required when type is Kind }
        unit: { type: string }
        relatedDisaster: { type: string, description: Disaster ObjectId }
        relatedShelter: { type: string, description: Shelter ObjectId }
        notes: { type: string }

    Alert:
      type: object
      properties:
        _id: { type: string }
        alertId: { type: string, example: AL-301 }
        title: { type: string }
        type: { $ref: "#/components/schemas/HazardType" }
        location: { type: string }
        priority: { $ref: "#/components/schemas/Severity" }
        description: { type: string }
        issuedBy: { type: string, description: User ObjectId }
        active: { type: boolean }
        relatedDisaster: { type: string, nullable: true, description: Disaster ObjectId }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AlertInput:
      type: object
      required: [title, type, location]
      properties:
        title: { type: string }
        type: { $ref: "#/components/schemas/HazardType" }
        location: { type: string }
        priority: { $ref: "#/components/schemas/Severity" }
        description: { type: string }
        relatedDisaster: { type: string, description: Disaster ObjectId }

    Notification:
      type: object
      properties:
        _id: { type: string }
        notificationId: { type: string, example: NT-1 }
        recipient: { type: string, nullable: true, description: User ObjectId; null means a broadcast notification }
        type: { type: string, enum: [Alert, Task, Donation, Disaster, Shelter, System] }
        title: { type: string }
        message: { type: string }
        relatedAlert: { type: string, nullable: true }
        relatedTask: { type: string, nullable: true }
        relatedDonation: { type: string, nullable: true }
        relatedDisaster: { type: string, nullable: true }
        relatedShelter: { type: string, nullable: true }
        readBy: { type: array, items: { type: string }, description: User ObjectIds who have read this notification }
        createdBy: { type: string, nullable: true, description: User ObjectId, null for system-generated notifications }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
