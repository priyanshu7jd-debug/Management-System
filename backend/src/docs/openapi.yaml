openapi: 3.0.3
info:
  title: AapdaSetu API
  description: >
    Backend API for AapdaSetu - Assam Disaster Intelligence Platform.
    Coordinates disaster reporting, relief shelters, resources, volunteers,
    tasks, donations and public alerts across roles (Citizen, Volunteer,
    Authority, Admin).


    All responses share a common envelope: `{ "success": true, "data": ... }`
    on success, and `{ "success": false, "message": "..." }` on error. List
    endpoints additionally return `count`, `total`, `page` and `pages`.


    Authenticate by logging in or registering, then send the returned JWT as
    `Authorization: Bearer <token>` on subsequent requests.
  version: "1.0.0"
  contact:
    name: AapdaSetu Backend
servers:
  - url: http://localhost:5000
    description: Local development
  - url: /
    description: Current host

tags:
  - name: Auth
    description: Registration, login and the current user's own profile
  - name: Users
    description: Admin-only user management
  - name: Disasters
    description: Disaster/incident reporting and lifecycle
  - name: Alerts
    description: Public emergency alerts
  - name: Shelters
    description: Relief shelters and occupancy
  - name: Volunteers
    description: Volunteer registration and assignment
  - name: Resources
    description: Relief supply inventory
  - name: Tasks
    description: Work assigned to volunteers/authorities
  - name: Donations
    description: Cash and in-kind donations
  - name: Dashboard
    description: Cross-module aggregated statistics
  - name: Notifications
    description: The current user's notification feed
  - name: Health
    description: Service health check

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Health
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: AapdaSetu API is running }

  # ---------------------------------------------------------------- Auth
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Self-registration only allows the Citizen, Volunteer and Authority roles. Admin accounts must be created separately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Anup Kalita }
                email: { type: string, format: email, example: anup@example.com }
                password: { type: string, format: password, minLength: 6, example: Password123 }
                role: { type: string, enum: [Citizen, Volunteer, Authority], example: Citizen }
                district: { type: string, example: Nagaon }
                phone: { type: string, example: "9800000006" }
      responses:
        "201":
          description: User created, returns an auth token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login successful, returns an auth token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the logged-in user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Auth]
      summary: Update the logged-in user's name, district or phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                district: { type: string }
                phone: { type: string }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/me/password:
    put:
      tags: [Auth]
      summary: Update the logged-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 6 }
      responses:
        "200":
          description: Password updated, returns a fresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Password updated successfully }
                  data:
                    type: object
                    properties:
                      token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- Users
  /api/users:
    get:
      tags: [Users]
      summary: List users (Admin only)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: role
          in: query
          schema: { type: string, enum: [Citizen, Authority, Volunteer, Admin] }
        - name: status
          in: query
          schema: { type: string, enum: [Active, Blocked] }
        - name: district
          in: query
          schema: { type: string }
        - name: search
          in: query
          description: Case-insensitive match against name or email
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/UserList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/stats/summary:
    get:
      tags: [Users]
      summary: User counts by role/status (Admin only)
      responses:
        "200": { description: Aggregated stats }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID (Admin only)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Users]
      summary: Delete a user (Admin only)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/DeletedOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/{id}/role:
    patch:
      tags: [Users]
      summary: Change a user's role (Admin only)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [Citizen, Authority, Volunteer, Admin] }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/{id}/status:
    patch:
      tags: [Users]
      summary: Block or unblock a user (Admin only)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [Active, Blocked] }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------ Disasters
  /api/disasters:
    get:
      tags: [Disasters]
      summary: List disasters (filter + paginate)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DisasterStatus" }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/HazardType" }
        - name: severity
          in: query
          schema: { $ref: "#/components/schemas/Severity" }
        - name: mine
          in: query
          description: "If \"true\", only disasters reported by the current user"
          schema: { type: string, enum: ["true", "false"] }
        - name: search
          in: query
          description: Case-insensitive match against location
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of disasters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Disaster" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Disasters]
      summary: Report a new disaster/incident
      description: Any authenticated user may report an incident.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisasterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Disaster" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/disasters/stats/summary:
    get:
      tags: [Disasters]
      summary: Disaster counts by status/type/severity (Authority, Admin)
      responses:
        "200": { description: Aggregated stats }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/disasters/nearby:
    get:
      tags: [Disasters]
      summary: Find disasters near a point (2dsphere geo query)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lng"
        - $ref: "#/components/parameters/maxDistance"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DisasterStatus" }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Disasters ordered by distance, closest first. Each item includes a `distanceMeters` field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Disaster" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/disasters/{id}:
    get:
      tags: [Disasters]
      summary: Get a disaster by ID
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Disaster
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Disaster" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Disasters]
      summary: Update a disaster (Authority, Admin)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisasterInput" }
      responses:
        "200":
          description: Updated disaster
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Disaster" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Disasters]
      summary: Delete a disaster (Admin only)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/DeletedOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/disasters/{id}/status:
    patch:
      tags: [Disasters]
      summary: Verify, assign a team to, or resolve a disaster (Authority, Admin)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/DisasterStatus" }
                team: { type: string, example: Guwahati Flood Response Team }
      responses:
        "200":
          description: Updated disaster
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Disaster" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/disasters/{id}/images:
    post:
      tags: [Disasters]
      summary: Upload evidence photos for a disaster (up to 5, 5MB each)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Updated disaster with new image URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Disaster" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Disasters]
      summary: Remove one evidence photo from a disaster
      parameters:
        - { $ref: "#/components/parameters/id" }
        - name: imageUrl
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated disaster
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Disaster" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Alerts
  /api/alerts:
    get:
      tags: [Alerts]
      summary: List public emergency alerts
      description: No authentication required.
      security: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: active
          in: query
          schema: { type: string, enum: ["true", "false"], default: "true" }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/HazardType" }
        - name: priority
          in: query
          schema: { $ref: "#/components/schemas/Severity" }
      responses:
        "200":
          description: Paginated list of alerts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Alert" }
    post:
      tags: [Alerts]
      summary: Issue a new alert (Authority, Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/stats/summary:
    get:
      tags: [Alerts]
      summary: Alert counts by type/priority (Authority, Admin)
      responses:
        "200": { description: Aggregated stats }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/{id}:
    get:
      tags: [Alerts]
      summary: Get an alert by ID
      security: []
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Alert" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Alerts]
      summary: Update an alert (Authority, Admin)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertInput" }
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Alerts]
      summary: Delete an alert (Admin only)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/DeletedOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/{id}/deactivate:
    patch:
      tags: [Alerts]
      summary: Deactivate an alert (Authority, Admin)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Alert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- Shelters
  /api/shelters:
    get:
      tags: [Shelters]
      summary: List shelters
      description: No authentication required.
      security: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: status
          in: query
          schema: { type: string, enum: [Active, Full, Closed] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of shelters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Shelter" }
    post:
      tags: [Shelters]
      summary: Create a shelter (Authority, Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShelterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Shelter" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/shelters/nearby:
    get:
      tags: [Shelters]
      summary: Find shelters near a point (2dsphere geo query)
      security: []
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lng"
        - $ref: "#/components/parameters/maxDistance"
        - name: status
          in: query
          schema: { type: string, enum: [Active, Full, Closed] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Shelters ordered by distance, closest first. Each item includes a `distanceMeters` field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Shelter" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/shelters/stats/summary:
    get:
      tags: [Shelters]
      summary: Shelter capacity/occupancy stats (Authority, Admin)
      responses:
        "200": { description: Aggregated stats }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/shelters/{id}:
    get:
      tags: [Shelters]
      summary: Get a shelter by ID
      security: []
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Shelter
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Shelter" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Shelters]
      summary: Update a shelter (Authority, Admin)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShelterInput" }
      responses:
        "200":
          description: Updated shelter
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Shelter" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Shelters]
      summary: Delete a shelter (Admin only)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/DeletedOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
